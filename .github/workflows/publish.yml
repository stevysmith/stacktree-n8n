name: Publish

# Publishes to npm WITH provenance. n8n's community-node registry requires a
# provenance statement, which npm only generates from a trusted CI runner via
# OIDC (id-token: write) — a local `npm publish` cannot produce it.
#
# Trigger by pushing a version tag:  git tag v0.1.1 && git push origin v0.1.1
# (or run manually from the Actions tab). Needs one repo secret: NPM_TOKEN
# (an npm automation or granular-publish token). Bump package.json's version
# before tagging so it matches the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
